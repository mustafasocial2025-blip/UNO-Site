<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092461">
  <meta name="description" content="An interactive prototype of UNO's founder section.">
  <title>UNO — The Mind Behind UNO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23092461'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%234bbaff' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #061b50; color: #fff; }
    .founder {
      position: relative; isolation: isolate; overflow: hidden;
      background: radial-gradient(ellipse at 52% 48%, #124998 0%, #092e75 48%, #061b50 100%);
    }
    .founder::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background-image: linear-gradient(#b6d5ff12 1px, transparent 1px), linear-gradient(90deg, #b6d5ff12 1px, transparent 1px);
      background-size: 4.8vw 4.8vw;
    }
    .inner { width: 100%; max-width: 2000px; margin: auto; padding: 5.5vw 3vw 5vw; position: relative; }
    h1 {
      margin: 0; position: relative; z-index: 1;
      font-weight: 900; text-transform: uppercase; letter-spacing: -.065em;
      text-shadow: 0 0 45px #b8d5ff12;
    }
    h1 span { display: block; white-space: nowrap; text-align: center; line-height: .82; }
    h1 span:nth-child(1) { font-size: clamp(1px, 18.1vw, 362px); }
    h1 span:nth-child(2) { font-size: clamp(1px, 24.2vw, 484px); margin-top: .6vw; }
    h1 span:nth-child(3) { font-size: clamp(1px, 29vw, 580px); margin-top: .6vw; }
    .card-wrap { position: absolute; z-index: 3; width: 24%; left: 10%; top: 47%; }
    .card { width: 100%; transform: rotate(5deg); transition: transform .3s ease; filter: drop-shadow(0 22px 24px #0006); }
    .card img { width: 100%; height: auto; display: block; }
    @media (hover: hover) { .card-wrap:hover .card { transform: rotate(2deg) translateY(-8px); } }
    @media (max-width: 650px) {
      .inner { padding-top: 13vw; padding-bottom: 13vw; }
      .founder::before { background-size: 10vw 10vw; }
      .card-wrap { width: 27%; left: 7%; top: 48%; }
    }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card-wrap:hover .card { transform: rotate(5deg); } }

    /* Light, orbit and perspective establish a scene around the approved art. */
    body { background: #030d29; }
    .founder { min-height: 100svh; display: grid; align-items: center; background: radial-gradient(ellipse at 75% 48%, #124edd 0, #082367 36%, #030d29 76%); }
    .founder::before { background: linear-gradient(115deg, transparent 35%, #307cff0a 48%, transparent 61%); }
    .inner { isolation: isolate; }
    .scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
    .halo { position: absolute; width: 55vw; height: 55vw; right: -7vw; top: 4%; border-radius: 50%; background: radial-gradient(circle, #4585ff26 0%, #285dff08 52%, transparent 67%); box-shadow: inset 0 0 85px #447dff30, 0 0 110px #285eff24; border: 1px solid #72a7ff45; }
    .halo::before, .halo::after { content: ''; position: absolute; border-radius: 50%; inset: 9%; border: 1px solid #88b8ff25; }
    .halo::after { inset: -9%; border-color: #648fff14; }
    .orbit { position: absolute; width: 69vw; height: 20vw; right: -13%; top: 45%; border: 1px solid #8dbaff66; border-radius: 50%; transform: rotate(-34deg); box-shadow: 0 -2px 16px #528aff25; }
    .orbit::after { content: ''; position: absolute; width: 7px; height: 7px; top: 22%; left: 7%; background: #d8efff; border-radius: 50%; box-shadow: 0 0 20px 5px #589bff; }
    .floor { position: absolute; width: 150%; height: 45%; left: -25%; bottom: -24%; background-image: linear-gradient(#73a5ff20 1px, transparent 1px), linear-gradient(90deg, #73a5ff20 1px, transparent 1px); background-size: 65px 65px; transform: perspective(400px) rotateX(58deg); mask-image: linear-gradient(transparent, black); }
    h1 { text-shadow: 0 10px 50px #0003; }
    h1 span:nth-child(3) { color: #dceaff; text-shadow: 0 0 70px #70a6ff3d; }
    .card-wrap { left: auto; right: 8%; top: 38%; width: 29%; perspective: 1000px; animation: float 7s ease-in-out infinite; }
    .card-wrap::after { content: ''; position: absolute; left: 0; right: -10%; bottom: -9%; height: 12%; background: #02081799; border-radius: 50%; filter: blur(18px); z-index: -1; }
    .card { transform: rotate(10deg) rotateY(-12deg); filter: drop-shadow(-20px 25px 26px #01051bad) drop-shadow(3px 0 5px #a1cdff38); transition: transform .5s ease, filter .5s ease; }
    @media (hover: hover) { .card-wrap:hover .card { transform: rotate(3deg) rotateY(0deg) scale(1.06); filter: drop-shadow(-20px 30px 35px #01051bc0) drop-shadow(0 0 10px #b8daff55); } }
    @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -12px; } }
    @media (max-width: 650px) {
      .founder { min-height: 100svh; }
      .inner { padding-top: 16vw; padding-bottom: 24vw; }
      .card-wrap { width: 33%; right: 4%; top: 40%; }
      .halo { width: 78vw; height: 78vw; right: -18vw; top: 17%; }
      .orbit { width: 105vw; height: 34vw; right: -35%; top: 46%; }
    }
    @media (prefers-reduced-motion: reduce) { .card-wrap { animation: none; } .card { transition: none; } }

    h1 { color: #bc8cff; }
    h1 span:nth-child(3) { color: #ffffff; text-shadow: 0 0 70px #70a6ff3d; }

    h1 span:nth-child(1), h1 span:nth-child(2) {
      color: #ad4cf2;
      background: linear-gradient(100deg, #d63de3 4%, #a64ef2 43%, #587fff 96%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="founder" aria-labelledby="founder-title">
      <div class="inner">
        <div class="scene" aria-hidden="true"><div class="halo"></div><div class="orbit"></div><div class="floor"></div></div>
        <h1 id="founder-title"><span>The mind</span><span>behind</span><span>UNO</span></h1>
        <div class="card-wrap"><div class="card"><img src="./mustafa-card.png" alt="Mustafa, Founder, depicted as a cartoon robotic Pharaoh on a silver card"></div></div>
      </div>
    </section>
  </main>
</body>
</html>
